banner motd ^CACCESO SOLO AUTORIZADO - LAB PRIMER PARCIAL^C
line con 0
 exec-timeout 15 0
 logging synchronous
 login local
line aux 0
line vty 0 4
 login local
 transport input telnet ssh
line vty 5 15
 login local
 transport input telnet ssh
end
