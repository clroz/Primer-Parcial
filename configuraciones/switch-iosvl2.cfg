version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
hostname SW-PRIMER-PARCIAL

vlan 10
 name USUARIOS
vlan 20
 name ADMINISTRACION
vlan 30
 name SERVIDORES
boot-start-marker
boot-end-marker
no aaa new-model
no ip domain-lookup
ip cef
no ipv6 cef
spanning-tree mode pvst
spanning-tree extend system-id
vlan access-map VACL-WEB 10
 match ip address WEB-EGRESS-ALLOW
 action forward
vlan access-map VACL-WEB 20
 match ip address WEB-EGRESS-ALL
 action drop
vlan access-map VACL-WEB 30
 action forward
vlan filter VACL-WEB vlan-list 30
interface GigabitEthernet0/0
 description TRUNK-FGT1-port2
 switchport trunk allowed vlan 10,20,30
 switchport trunk encapsulation dot1q
 switchport mode trunk
 negotiation auto
interface GigabitEthernet0/1
 description WEB-SERVER
 switchport access vlan 30
 switchport mode access
 negotiation auto
 spanning-tree portfast edge
interface GigabitEthernet0/2
 description PC-VLAN20
 switchport access vlan 20
 switchport mode access
 negotiation auto
 spanning-tree portfast edge
interface GigabitEthernet0/3
 description PC-VLAN10
 switchport access vlan 10
 switchport mode access
 negotiation auto
 spanning-tree portfast edge
interface GigabitEthernet1/0
 description DB-SERVER
 switchport access vlan 30
 switchport mode access
 negotiation auto
 spanning-tree portfast edge
interface GigabitEthernet1/1
 negotiation auto
interface GigabitEthernet1/2
 negotiation auto
interface GigabitEthernet1/3
 negotiation auto
interface Vlan20
 description SWITCH-MGMT
 ip address 10.17.45.130 255.255.255.128
ip default-gateway 10.17.45.129
ip forward-protocol nd
ip http server
ip http secure-server
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip access-list extended WEB-EGRESS-ALL
 permit ip host 10.17.46.2 any
ip access-list extended WEB-EGRESS-ALLOW
 permit tcp host 10.17.46.2 host 10.17.46.3 eq 3306
 permit udp host 10.17.46.2 host 10.17.46.1 eq domain
 permit tcp host 10.17.46.2 host 10.17.46.1 eq domain
 permit tcp host 10.17.46.2 any eq www
 permit tcp host 10.17.46.2 any eq 443
 permit tcp host 10.17.46.2 any established
control-plane
banner exec ^C
