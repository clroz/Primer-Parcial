config system global
    set hostname "FG-BRANCH"
    set timezone 04
end
config system interface
    edit "port1"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping
        set type physical
        set alias "WAN-ISP"
    next
    edit "port2"
        set ip 10.17.47.1 255.255.255.240
        set allowaccess ping
        set type physical
        set alias "BRANCH-LAN"
    next
    edit "HQ-BRANCH"
        set type tunnel
        set interface "port1"
    next
end
config router static
    edit 1
        set gateway 198.51.100.1
        set device "port1"
    next
    edit 2
        set dst 10.17.46.0 255.255.255.240
        set device "HQ-BRANCH"
    next
end
config firewall address
    edit "WEB-SERVER"
        set subnet 10.17.46.2 255.255.255.255
    next
    edit "BRANCH-LAN"
        set subnet 10.17.47.0 255.255.255.240
    next
end
config firewall policy
    edit 1
        set name "BRANCH-WEB"
        set srcintf "port2"
        set dstintf "HQ-BRANCH"
        set action accept
        set srcaddr "BRANCH-LAN"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "HTTP"
        set logtraffic all
    next
end
config vpn ipsec phase1-interface
    edit "HQ-BRANCH"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device enable
        set proposal des-sha1
        set dpd on-idle
        set dhgrp 14
        set remote-gw 203.0.113.2
    next
end
config vpn ipsec phase2-interface
    edit "HQ-BRANCH-P2"
        set phase1name "HQ-BRANCH"
        set proposal des-sha1
        set src-subnet 10.17.47.0 255.255.255.240
        set dst-subnet 10.17.46.0 255.255.255.240
    next
end