config system global
    set hostname "FG-HQ"
    set admin-server-cert "Fortinet_Factory"
    set timezone 04
end
config system interface
    edit "port1"
        set ip 203.0.113.2 255.255.255.252
        set allowaccess ping
        set type physical
        set alias "WAN-ISP"
    next
    edit "port2"
        set allowaccess ping
        set type physical
        set alias "TRUNK-SWITCH"
    next
    edit "VLAN10"
        set ip 10.17.45.1 255.255.255.128
        set allowaccess ping
        set alias "USERS-VLAN10"
        set role lan
        set interface "port2"
        set vlanid 10
    next
    edit "VLAN20"
        set ip 10.17.45.129 255.255.255.128
        set allowaccess ping https http
        set alias "ADMIN-VLAN20"
        set role lan
        set interface "port2"
        set vlanid 20
    next
    edit "SERVERS"
        set ip 10.17.46.1 255.255.255.240
        set allowaccess ping
        set alias "SERVERS-VLAN30"
        set role lan
        set interface "port2"
        set vlanid 30
    next
    edit "HQ-BRANCH"
        set type tunnel
        set interface "port1"
    next
end
config system dhcp server
    edit 10
        set default-gateway 10.17.45.1
        set netmask 255.255.255.128
        set interface "VLAN10"
        set dns-server1 10.17.45.1
        config ip-range
            edit 1
                set start-ip 10.17.45.20
                set end-ip 10.17.45.120
            next
        end
    next
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "port1"
    next
    edit 2
        set dst 10.17.47.0 255.255.255.240
        set device "HQ-BRANCH"
    next
end
config firewall address
    edit "WEB-SERVER"
        set subnet 10.17.46.2 255.255.255.255
    next
    edit "DB-SERVER"
        set subnet 10.17.46.3 255.255.255.255
    next
    edit "LAN-VLAN10"
        set subnet 10.17.45.0 255.255.255.128
    next
    edit "LAN-VLAN20"
        set subnet 10.17.45.128 255.255.255.128
    next
    edit "BRANCH-LAN"
        set subnet 10.17.47.0 255.255.255.240
    next
    edit "UBUNTU-ARCHIVE"
        set type fqdn
        set fqdn "archive.ubuntu.com"
    next
    edit "UBUNTU-SECURITY"
        set type fqdn
        set fqdn "security.ubuntu.com"
    next
end
config firewall addrgrp
    edit "UBUNTU-UPDATES"
        set member "UBUNTU-ARCHIVE" "UBUNTU-SECURITY"
    next
end
config firewall service custom
    edit "MYSQL-3306"
        set tcp-portrange 3306
    next
end
config webfilter urlfilter
    edit 1
        set name "DENY-EXE"
        config entries
            edit 1
                set url "*.exe"
                set type wildcard
                set action block
            next
        end
    next
end
config webfilter profile
    edit "WF-BLOCK-EXE"
        config web
            set urlfilter-table 1
        end
        set log-all-url enable
    next
end
config firewall policy
    edit 1
        set name "USERS-TO-WEB"
        set srcintf "VLAN10"
        set dstintf "SERVERS"
        set action accept
        set srcaddr "LAN-VLAN10"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set webfilter-profile "WF-BLOCK-EXE"
        set logtraffic all
    next
    edit 2
        set name "ADMIN-TO-WEB"
        set srcintf "VLAN20"
        set dstintf "SERVERS"
        set action accept
        set srcaddr "LAN-VLAN20"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set webfilter-profile "WF-BLOCK-EXE"
        set logtraffic all
    next
    edit 3
        set name "ADMIN-TO-DB"
        set srcintf "VLAN20"
        set dstintf "SERVERS"
        set action accept
        set srcaddr "LAN-VLAN20"
        set dstaddr "DB-SERVER"
        set schedule "always"
        set service "MYSQL-3306"
        set logtraffic all
    next
    edit 4
        set name "USERS-INTERNET"
        set srcintf "VLAN10"
        set dstintf "port1"
        set action accept
        set srcaddr "LAN-VLAN10"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 5
        set name "ADMIN-INTERNET"
        set srcintf "VLAN20"
        set dstintf "port1"
        set action accept
        set srcaddr "LAN-VLAN20"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 6
        set name "SERVER-UPDATE-ONLY"
        set srcintf "SERVERS"
        set dstintf "port1"
        set action accept
        set srcaddr "WEB-SERVER" "DB-SERVER"
        set dstaddr "UBUNTU-UPDATES"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set logtraffic all
        set nat enable
    next
    edit 7
        set name "DENY-SERVER-OTHER-EGRESS"
        set srcintf "SERVERS"
        set dstintf "port1"
        set action deny
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 8
        set name "BRANCH-WEB"
        set srcintf "HQ-BRANCH"
        set dstintf "SERVERS"
        set action accept
        set srcaddr "BRANCH-LAN"
        set dstaddr "WEB-SERVER"
        set schedule "always"
        set service "HTTP"
        set logtraffic all
    next
    edit 9
        set name "VLAN10-EXPLICIT-SERVER-DENY"
        set srcintf "VLAN10"
        set dstintf "SERVERS"
        set action deny
        set srcaddr "LAN-VLAN10"
        set dstaddr "WEB-SERVER" "DB-SERVER"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
config vpn ipsec phase1-interface
    edit "HQ-BRANCH"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device enable
        set proposal des-sha1
        set dpd on-idle
        set dhgrp 14
        set remote-gw 198.51.100.2
    next
end
config vpn ipsec phase2-interface
    edit "HQ-BRANCH-P2"
        set phase1name "HQ-BRANCH"
        set proposal des-sha1
        set src-subnet 10.17.46.0 255.255.255.240
        set dst-subnet 10.17.47.0 255.255.255.240
    next
end